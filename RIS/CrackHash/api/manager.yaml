openapi: 3.0.0
info:
  title: CrackHash Manager API
  version: 0.0.1
  contact:
    name: API Support

servers:
  - url: http://localhost:8080
    description: Development server

tags:
  - name: hash
    description: Operations for hash cracking

paths:
  /api/hash/crack:
    post:
      tags:
        - hash
      summary: Create hash cracking request
      description: Submits a request to crack an MD5 hash using brute force
      operationId: crackHash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrackHashRequest'
            examples:
              example1:
                summary: Crack hash for word "abcd"
                value:
                  hash: "e2fc714c4727ee9395f324cd2e7f331f"
                  maxLength: 5
              example2:
                summary: Crack hash for word "xyz24"
                value:
                  hash: "ea138386344970140e9a7d77830c1abd"
                  maxLength: 5
      responses:
        '200':
          description: Request successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrackHashResponse'
              examples:
                example1:
                  value:
                    requestId: "730a04e6-4de9-41f9-9d5b-53b88b17afac"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/hash/status:
    get:
      tags:
        - hash
      summary: Get request status
      description: Returns the current status of hash cracking request
      operationId: getCrackStatus
      parameters:
        - name: requestId
          in: query
          required: true
          description: Request identifier
          schema:
            type: string
            format: uuid
          example: "730a04e6-4de9-41f9-9d5b-53b88b17afac"
      responses:
        '200':
          description: Status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              examples:
                inProgress:
                  summary: Request in progress
                  value:
                    status: "IN_PROGRESS"
                    data: null
                ready:
                  summary: Result ready
                  value:
                    status: "READY"
                    data: ["abcd"]
                error:
                  summary: Processing error
                  value:
                    status: "ERROR"
                    data: null
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CrackHashRequest:
      type: object
      required:
        - hash
        - maxLength
      properties:
        hash:
          type: string
          description: MD5 hash to crack (32 characters in hex format)
          pattern: '^[a-fA-F0-9]{32}$'
          example: "e2fc714c4727ee9395f324cd2e7f331f"
        maxLength:
          type: integer
          description: Maximum length of the target word
          minimum: 1
          maximum: 32
          example: 4

    CrackHashResponse:
      type: object
      required:
        - requestId
      properties:
        requestId:
          type: string
          format: uuid
          description: Unique request identifier
          example: "730a04e6-4de9-41f9-9d5b-53b88b17afac"

    StatusResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          enum:
            - IN_PROGRESS
            - READY
            - ERROR
          description: Request processing status
          example: "READY"
        data:
          type: array
          nullable: true
          items:
            type: string
          description: Array of found words (null if status is not READY)
          example: ["abcd"]

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
          example: "BAD_REQUEST"
        message:
          type: string
          description: Error description
          example: "Invalid hash format"
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
          example: "2026-02-15T10:30:00Z"
