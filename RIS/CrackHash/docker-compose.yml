services:
  manager:
    build:
      context: .
      dockerfile: manager/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PART_COUNT=5
      - MONGO_URI=mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    networks:
      - microservices
    depends_on:
      rabbitmq:
        condition: service_started
      mongo1:
        condition: service_started
    develop:
      watch:
        - action: rebuild
          path: ./manager
          target: /app

  worker1:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    networks:
      - microservices
    depends_on:
      rabbitmq:
        condition: service_healthy

  worker2:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    networks:
      - microservices
    depends_on:
      rabbitmq:
        condition: service_healthy

  worker3:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    networks:
      - microservices
    depends_on:
      rabbitmq:
        condition: service_healthy

  worker4:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    networks:
      - microservices
    depends_on:
      rabbitmq:
        condition: service_healthy

  worker5:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    networks:
      - microservices
    depends_on:
      rabbitmq:
        condition: service_healthy

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8090:8080"
    environment:
      URLS: >
        [
          { "name": "Manager API", "url": "http://localhost:8080/openapi.json" }
        ]
    networks:
      - microservices
    depends_on:
      - manager

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - microservices
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 5

  mongo1:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo1_data:/data/db
    networks:
      - microservices

  mongo2:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo2_data:/data/db
    networks:
      - microservices

  mongo3:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo3_data:/data/db
    networks:
      - microservices

  mongo-init:
    image: mongo:7
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    networks:
      - microservices
    entrypoint: >
      bash -c '
      until mongosh --host mongo1:27017 --eval "db.adminCommand(\"ping\")"; do
        echo "Waiting for mongo1...";
        sleep 2;
      done;

      mongosh --host mongo1:27017 --eval "
      rs.initiate({
        _id: \"rs0\",
        members: [
          { _id: 0, host: \"mongo1:27017\", priority: 3 },
          { _id: 1, host: \"mongo2:27017\", priority: 2 },
          { _id: 2, host: \"mongo3:27017\", priority: 1 }
        ]
      })"
      '

networks:
  microservices:
    driver: bridge

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  rabbitmq_data:
